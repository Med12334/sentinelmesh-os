version: '3.8'

services:
  postgres-forensic-vault:
    image: postgres:16-alpine
    container_name: sentinelmesh-postgres
    environment:
      POSTGRES_DB: sentinelmesh_forensics_db
      POSTGRES_USER: sentinel_admin
      POSTGRES_PASSWORD: sentinel_password
    ports:
      - "5432:5432"
    volumes:
      - ./sql/init-postgres-forensics.sql:/docker-entrypoint-initdb.d/init-postgres-forensics.sql

  ibm-db2-compliance:
    image: icr.io/db2_community/db2:11.5.9.0
    container_name: sentinelmesh-db2-vault
    privileged: true
    environment:
      LICENSE: accept
      DB2INST1_PASSWORD: db2admin_password
      DBNAME: SEC_COMP
    ports:
      - "50000:50000"
    volumes:
      - ./sql/init-db2-compliance.sql:/var/custom/init-db2-compliance.sql

  kafka:
    image: apache/kafka:3.7.0
    container_name: sentinelmesh-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
