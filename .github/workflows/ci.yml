name: SentinelMesh OS 10-Layer Polyglot CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  java-zero-trust-soar-mesh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Verify & Run JUnit 5 Suite Across 6 Security Microservices
        working-directory: ./backend-mesh
        run: mvn clean test package

  python-ai-threat-and-chaos-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies & Run Pytest MITRE & Chaos Suite
        working-directory: ./intelligence-plane
        run: |
          pip install -r requirements.txt
          PYTHONPATH=. pytest -v
